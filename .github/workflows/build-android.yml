name: Build Baby Run Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UNITY_VERSION: 2022.3.52f1
  APK_ARTIFACT_NAME: Baby-Run-Android-APK

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required Unity secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Missing required GitHub Actions secret: UNITY_LICENSE"
            missing=1
          fi
          if [ -z "$UNITY_EMAIL" ]; then
            echo "::error::Missing required GitHub Actions secret: UNITY_EMAIL"
            missing=1
          fi
          if [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Missing required GitHub Actions secret: UNITY_PASSWORD"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Create UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Unity licensing secrets are present."

      - name: Build Android APK with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: BuildScript.BuildAndroid
          versioning: None

      - name: Find and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find Builds -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$apk_path" ] || [ ! -s "$apk_path" ]; then
            echo "::error::Unity completed without producing a non-empty APK under Builds/."
            exit 1
          fi
          mkdir -p Builds/Android
          cp "$apk_path" Builds/Android/Baby-Run.apk
          echo "apk_path=Builds/Android/Baby-Run.apk" >> "$GITHUB_OUTPUT"
          echo "APK_PATH=Builds/Android/Baby-Run.apk" >> "$GITHUB_ENV"
          {
            echo "## Android APK build result"
            echo "- **Result:** Success"
            echo "- **Artifact:** \\`${APK_ARTIFACT_NAME}\\`"
            echo "- **File:** \\`Builds/Android/Baby-Run.apk\\`"
            echo "- **Unity:** \\`${UNITY_VERSION}\\`"
          } >> "$GITHUB_STEP_SUMMARY"
          file Builds/Android/Baby-Run.apk
          ls -lh Builds/Android/Baby-Run.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Unity logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Baby-Run-Unity-Build-Logs
          path: |
            **/Editor.log
            **/*.log
          if-no-files-found: ignore
          retention-days: 7
