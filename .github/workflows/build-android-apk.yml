name: Build Baby Run Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UNITY_VERSION: 2022.3.52f1

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: BuildScript.BuildAndroid
          versioning: None

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          test -s Builds/Android/Baby-Run.apk
          file Builds/Android/Baby-Run.apk

      - name: Upload Baby Run APK
        uses: actions/upload-artifact@v4
        with:
          name: Baby-Run-Android-APK
          path: Builds/Android/Baby-Run.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Unity build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Baby-Run-Unity-Build-Logs
          path: |
            **/Editor.log
            **/*.log
          if-no-files-found: ignore
          retention-days: 7
